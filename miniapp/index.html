<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smart Deals & Regali 🛍️</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --hint-color: var(--tg-theme-hint-color, #94a3b8);
      --btn-color: var(--tg-theme-button-color, #ff9900);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-pink: #ec4899;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-title span.badge {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .user-greeting {
      font-size: 0.8rem;
      color: var(--hint-color);
      white-space: nowrap;
    }

    /* Search Bar */
    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: var(--text-color);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.6;
    }

    /* Category Pills */
    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex: 0 0 auto;
      padding: 7px 13px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .cat-pill.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .cat-pill.xmas-pill.active {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #fff;
      border-color: #ef4444;
    }

    .cat-pill.fashion-pill.active {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff;
      border-color: #ec4899;
    }

    /* Sub-filters (Price range) */
    .price-filters {
      display: flex;
      gap: 6px;
      padding: 10px 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .price-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      color: var(--hint-color);
      cursor: pointer;
    }

    .price-pill.active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border-color: rgba(245, 158, 11, 0.4);
      font-weight: 700;
    }

    /* Deals Grid */
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 10px 16px;
    }

    @media (min-width: 640px) {
      .deals-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Deal Card */
    .deal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .deal-card:active {
      transform: scale(0.98);
    }

    .image-container {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .deal-img {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      object-fit: contain;
    }

    .badge-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .badge-xmas {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #ffffff;
      border: none;
    }

    .badge-fashion {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #ffffff;
      border: none;
    }

    .disc-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
    }

    .card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .deal-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
    }

    .current-price {
      font-size: 1.15rem;
      font-weight: 900;
      color: #10b981;
    }

    .orig-price {
      font-size: 0.75rem;
      color: var(--hint-color);
      text-decoration: line-through;
    }

    /* Card Action Buttons */
    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-buy {
      width: 100%;
      background: #ff9900;
      color: #111;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 8px 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-buy:active {
      opacity: 0.85;
    }

    .wa-buttons-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-wa-direct {
      flex: 1.15;
      background: #25d366;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-wa-direct:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-copy {
      flex: 1;
      background: rgba(37, 211, 102, 0.15);
      border: 1px solid rgba(37, 211, 102, 0.35);
      color: #25d366;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
      transition: transform 0.1s;
    }

    .btn-copy:active {
      background: rgba(37, 211, 102, 0.35);
      transform: scale(0.97);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #1e293b;
      border: 1px solid #10b981;
      color: #f8fafc;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Price Radar Floating Banner */
    .radar-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }

    .radar-info {
      font-size: 0.78rem;
      line-height: 1.25;
    }

    .radar-info strong {
      color: var(--accent-gold);
      display: block;
    }

    .btn-radar {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }

    /* Empty state & Smart Amazon Search Fallback */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 16px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin: 10px 0;
    }

    .empty-state span {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    .empty-state p {
      font-size: 0.85rem;
      color: var(--hint-color);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .search-fallback-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(239, 68, 68, 0.08));
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="top-bar">
      <div class="brand-title">
        🛍️ Smart Deals <span class="badge">Natale 2026</span>
      </div>
      <div class="user-greeting" id="userGreeting">Benvenuto!</div>
    </div>

    <!-- Official WhatsApp Banner -->
    <a href="https://whatsapp.com/channel/0029VbETLnsD38CLMNvogI3g" target="_blank" class="wa-banner" style="display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #128c7e, #25d366); color: white; padding: 9px 13px; border-radius: 12px; margin-bottom: 12px; text-decoration: none; font-size: 0.82rem; font-weight: 700; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.15rem;">🟢</span>
        <span>Canale WhatsApp Ufficiale</span>
      </div>
      <span style="background: rgba(255,255,255,0.25); padding: 3px 8px; border-radius: 20px; font-size: 0.72rem;">Unisciti ➔</span>
    </a>

    <!-- Search bar -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Cerca ps5, borse guess, scarpe geox, lego..." oninput="handleSearch()">
    </div>

    <!-- Categories -->
    <div class="categories-scroll">
      <button class="cat-pill active" onclick="setCategory('all', this)">🌟 Tutte (<span id="countAll">0</span>)</button>
      <button class="cat-pill xmas-pill" onclick="setCategory('natale', this)">🎄 Regali Natale</button>
      <button class="cat-pill fashion-pill" onclick="setCategory('moda', this)">👗 Moda & Borse</button>
      <button class="cat-pill" onclick="setCategory('lowcost', this)">🪙 Sotto 10€</button>
      <button class="cat-pill" onclick="setCategory('bambini', this)">🧸 Giochi & Bimbi</button>
      <button class="cat-pill" onclick="setCategory('casa', this)">🍳 Casa & Cucina</button>
      <button class="cat-pill" onclick="setCategory('bellezza', this)">💄 Bellezza</button>
      <button class="cat-pill" onclick="setCategory('tech', this)">⚡ Tech & Gaming</button>
    </div>
  </header>

  <!-- Price Sub-filters -->
  <div class="price-filters">
    <button class="price-pill active" onclick="setPriceFilter(0, this)">Tutti i prezzi</button>
    <button class="price-pill" onclick="setPriceFilter(10, this)">Sotto 10€</button>
    <button class="price-pill" onclick="setPriceFilter(25, this)">Sotto 25€</button>
    <button class="price-pill" onclick="setPriceFilter(50, this)">Sotto 50€</button>
  </div>

  <!-- Deals Grid -->
  <main class="deals-grid" id="dealsGrid">
    <div class="empty-state">
      <span>⏳</span>
      Caricamento offerte e regali in corso...
    </div>
  </main>

  <!-- Floating Toast -->
  <div id="toast" class="toast">
    <span>✅</span> Testo WhatsApp copiato! Incollalo in chat
  </div>

  <!-- Price Radar Sticky Footer -->
  <div class="radar-banner">
    <div class="radar-info">
      <strong>🔔 Vuoi monitorare un prezzo?</strong>
      Invia il link al Bot Radar per avvisi sui cali
    </div>
    <a href="https://t.me/AmazonPriceRadar_bot" class="btn-radar" target="_blank" onclick="openRadar(event)">Attiva Radar</a>
  </div>

  <script>
    const AFFILIATE_TAG = "convenientiof-21";

    // Inizializza Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        const name = u.first_name ? u.first_name : "Utente";
        document.getElementById("userGreeting").textContent = "Ciao, " + name + " 👋";
      }
    }

    let allDeals = [];
    window.dealsMap = {};
    let currentCategory = 'all';
    let maxPriceFilter = 0;
    let searchQuery = '';

    // Carica offerte da deals.json
    async function loadDeals() {
      try {
        const res = await fetch('deals.json?v=' + Date.now());
        if (!res.ok) throw new Error("Fetch error");
        allDeals = await res.json();
      } catch (err) {
        console.warn("Caricamento fallback...");
        allDeals = [
          {
            asin: "B0H2MQZ6K8",
            title: "Yankee Candle Set Regalo Candele Profumate Natalizie",
            short_title: "Yankee Candle Set Regalo Candele Natalizie",
            price: "15,99 €",
            original_price: "19,99 €",
            discount_pct: 20,
            image_url: "https://m.media-amazon.com/images/I/71YyO3Yv8GL._AC_SL1500_.jpg",
            affiliate_url: "https://www.amazon.it/dp/B0H2MQZ6K8?tag=" + AFFILIATE_TAG,
            category: "natale",
            badge: "🎄 Regalo Natale",
            whatsapp_text: "🎄 *IDEA REGALO DI NATALE (-20%)*\n🎁 *Yankee Candle Set Regalo Candele Natalizie*\n💰 Prezzo regalo: *15,99 €* invece di ~19,99 €~ 🚚 _Prime_\n👉 *Guarda l'offerta qui (#adv):*\nhttps://www.amazon.it/dp/B0H2MQZ6K8?tag=" + AFFILIATE_TAG
          }
        ];
      }

      // Mappa globale per ASIN (risolve al 100% qualsiasi errore di escaping dei caratteri)
      window.dealsMap = {};
      allDeals.forEach(d => {
        if (d.asin) window.dealsMap[d.asin] = d;
      });

      document.getElementById('countAll').textContent = allDeals.length;
      renderDeals();
    }

    function parsePrice(priceStr) {
      if (!priceStr) return 0;
      const clean = priceStr.replace(/[^0-9,]/g, '').replace(',', '.');
      return parseFloat(clean) || 0;
    }

    function setCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      triggerHaptic();
      renderDeals();
    }

    function setPriceFilter(maxP, el) {
      maxPriceFilter = maxP;
      document.querySelectorAll('.price-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      triggerHaptic();
      renderDeals();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderDeals();
    }

    function triggerHaptic(type = 'light') {
      if (tg && tg.HapticFeedback) {
        if (type === 'success') {
          tg.HapticFeedback.notificationOccurred('success');
        } else {
          tg.HapticFeedback.impactOccurred('light');
        }
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Copia sincrona ultra-compatibile con iOS WebKit, Android WebView e Telegram Mini App
    function copyTextToClipboard(text) {
      let successful = false;
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.width = "2em";
        ta.style.height = "2em";
        ta.style.padding = "0";
        ta.style.border = "none";
        ta.style.outline = "none";
        ta.style.boxShadow = "none";
        ta.style.background = "transparent";
        ta.style.opacity = "0.01";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        successful = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (err) {
        successful = false;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      return successful;
    }

    function copyDealWhatsApp(asin, e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }

      const deal = window.dealsMap[asin];
      if (!deal) return;

      const text = deal.whatsapp_text || `${deal.short_title || deal.title}\n💰 Prezzo: ${deal.price}\n👉 Link (#adv): ${deal.affiliate_url}`;
      copyTextToClipboard(text);

      const btn = (e && e.currentTarget) || (e && e.target);
      if (btn) {
        const origText = btn.innerHTML;
        btn.innerHTML = "✅ Copiato!";
        btn.style.background = "#22c55e";
        btn.style.color = "#ffffff";
        setTimeout(() => {
          btn.innerHTML = origText;
          btn.style.background = "";
          btn.style.color = "";
        }, 2000);
      }

      showToast();
      triggerHaptic('success');
    }

    // Condivisione diretta in 1-tap su WhatsApp
    function shareDealWhatsApp(asin, e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const deal = window.dealsMap[asin];
      if (!deal) return;
      const text = deal.whatsapp_text || `${deal.short_title || deal.title}\n💰 Prezzo: ${deal.price}\n👉 Link (#adv): ${deal.affiliate_url}`;
      copyTextToClipboard(text);
      const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
        window.Telegram.WebApp.openLink(waUrl);
      } else {
        window.open(waUrl, "_blank");
      }
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function openDeal(url, e) {
      if (e) e.preventDefault();
      triggerHaptic();
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    function openAmazonSearch(query, e) {
      if (e) e.preventDefault();
      triggerHaptic();
      const searchUrl = `https://www.amazon.it/s?k=${encodeURIComponent(query)}&tag=${AFFILIATE_TAG}`;
      if (tg && tg.openLink) {
        tg.openLink(searchUrl);
      } else {
        window.open(searchUrl, "_blank");
      }
    }

    function openRadar(e) {
      if (e) e.preventDefault();
      triggerHaptic();
      const botUrl = "https://t.me/AmazonPriceRadar_bot";
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(botUrl);
      } else {
        window.open(botUrl, "_blank");
      }
    }

    function renderDeals() {
      const grid = document.getElementById('dealsGrid');
      grid.innerHTML = '';

      let filtered = allDeals.filter(deal => {
        // Categoria
        if (currentCategory !== 'all' && deal.category !== currentCategory) {
          return false;
        }
        // Filtro Prezzo Max
        const p = parsePrice(deal.price);
        if (maxPriceFilter > 0 && p > maxPriceFilter) {
          return false;
        }
        // Ricerca testo
        if (searchQuery) {
          const matchTitle = (deal.title || '').toLowerCase().includes(searchQuery);
          const matchCat = (deal.category || '').toLowerCase().includes(searchQuery);
          if (!matchTitle && !matchCat) return false;
        }
        return true;
      });

      // Se la ricerca testuale è attiva, inserisce una barra speciale in cima per cercare direttamente su Amazon
      if (searchQuery) {
        const topSearchCard = document.createElement('div');
        topSearchCard.className = 'search-fallback-card';
        topSearchCard.innerHTML = `
          <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">
            🔍 Cerchi tutte le offerte per "<strong>${escapeHtml(searchQuery)}</strong>" su Amazon?
          </div>
          <button class="btn-buy" style="max-width: 260px; margin: 0 auto;" onclick="openAmazonSearch(document.getElementById('searchInput').value.trim(), event)">
            👉 Cerca su Amazon
          </button>
        `;
        grid.appendChild(topSearchCard);
      }

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        
        if (searchQuery) {
          empty.innerHTML = `
            <span>🛍️</span>
            <h3>Trova "${escapeHtml(searchQuery)}" in sconto su Amazon</h3>
            <p>
              Non abbiamo ancora salvato "${escapeHtml(searchQuery)}" nella vetrina flash, ma puoi visualizzare all'istante tutti gli sconti e i minimi storici su Amazon!
            </p>
            <button class="btn-buy" style="max-width: 280px; margin: 0 auto 10px; padding: 12px;" onclick="openAmazonSearch(document.getElementById('searchInput').value.trim(), event)">
              🛒 Mostra risultati su Amazon
            </button>
            <button class="btn-radar" style="max-width: 280px; margin: 0 auto; display: inline-block;" onclick="openRadar(event)">
              🔔 Monitora prezzo con il Bot
            </button>
          `;
        } else {
          empty.innerHTML = `
            <span>🔍</span>
            <h3>Nessun prodotto in questa categoria</h3>
            <p>Prova a selezionare un'altra categoria o azzera il filtro di prezzo!</p>
          `;
        }
        grid.appendChild(empty);
        return;
      }

      filtered.forEach(deal => {
        const card = document.createElement('div');
        card.className = 'deal-card';

        const discTag = deal.discount_pct && deal.discount_pct > 0
          ? `<span class="disc-tag">-${escapeHtml(deal.discount_pct)}%</span>`
          : '';

        let badgeTag = '';
        if (deal.badge) {
          const isXmasBadge = deal.badge.includes('Natale') || deal.badge.includes('Regalo');
          const isFashionBadge = deal.badge.includes('Moda') || deal.badge.includes('Marca');
          const bClass = isXmasBadge ? 'badge-xmas' : (isFashionBadge ? 'badge-fashion' : '');
          badgeTag = `<span class="badge-tag ${bClass}">${escapeHtml(deal.badge)}</span>`;
        }

        const origPrice = deal.original_price && deal.original_price !== deal.price
          ? `<span class="orig-price">${escapeHtml(deal.original_price)}</span>`
          : '';

        const safeTitle = escapeHtml(deal.short_title || deal.title);
        const safePrice = escapeHtml(deal.price);
        const safeUrl = encodeURI(deal.affiliate_url);
        const safeImg = encodeURI(deal.image_url);
        const safeAsin = escapeHtml(deal.asin);

        card.innerHTML = `
          <div class="image-container" onclick="openDeal('${safeUrl}', event)">
            ${badgeTag}
            ${discTag}
            <img class="deal-img" src="${safeImg}" alt="${safeTitle}" loading="lazy">
          </div>
          <div class="card-content">
            <div class="deal-title" title="${escapeHtml(deal.title)}">${safeTitle}</div>
            <div class="price-row">
              <span class="current-price">${safePrice}</span>
              ${origPrice}
            </div>
            <div class="actions-row">
              <button class="btn-buy" onclick="openDeal('${safeUrl}', event)">
                🛒 Vedi su Amazon
              </button>
              <div class="wa-buttons-row">
                <button class="btn-wa-direct" onclick="shareDealWhatsApp('${safeAsin}', event)">
                  💬 Invia WhatsApp
                </button>
                <button class="btn-copy" onclick="copyDealWhatsApp('${safeAsin}', event)">
                  📋 Copia
                </button>
              </div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Caricamento iniziale
    loadDeals();
  </script>
</body>
</html>
